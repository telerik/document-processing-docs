name: Docs Feedback Agent

on:
  issues:
    types:
      - opened
      - labeled
      
permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  trigger-agent:
    runs-on: ubuntu-latest

    if: |
      contains(github.event.issue.labels.*.name, 'Docs Feedback') ||
      github.event.label.name == 'Docs Feedback'

    steps:
      - name: Invoke docs-editor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh issue comment \
            "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "@docs-editor Please review this documentation feedback and create a PR with the required updates."
