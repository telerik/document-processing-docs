name: Docs Feedback Agent

on:
  issues:
    types:
      - opened
      - labeled
      
permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  trigger-agent:
    runs-on: ubuntu-latest

    if: |
      contains(github.event.issue.labels.*.name, 'Docs Feedback') ||
      github.event.label.name == 'Docs Feedback'

    steps:
      - name: Assign issue to Copilot
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
        run: |
          gh api \
            repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/assignees \
            -f assignees[]=copilot

      - name: Tell Copilot to use docs-editor
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
        run: |
          gh issue comment \
            "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "@copilot

          Use the custom agent 'docs-editor' defined in:

          .github/agents/docs-editor.agent.md

          Review this documentation feedback, implement the required documentation updates, and create a pull request."
